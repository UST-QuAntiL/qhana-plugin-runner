{% import 'forms.html' as forms %}

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='forms.css')}}" media="screen" />
        <style>
            .qhana-dimension-feature {
                display: block;
                font-weight: normal;
                font-size: 0.85em;
                opacity: 0.8;
            }
        </style>
    </head>

    <body>
        <div class="qhana-microfrontend">
            <details id="visualization-options" open>
                <summary>Visualization Options</summary>
                {% call forms.render_form(target="microfrontend") %}
                    {{ forms.render_fields(schema, values=values, errors=errors) }}
                    <div class="qhana-form-buttons">
                    {{ forms.submit("validate", target="microfrontend")}}
                    {{ forms.submit("submit", action=process)}}
                    </div>
                {% endcall %}
            </details>
        </div>

        <div id="csv-preview" class="qhana-data-preview qhana-table" style="flex-direction: row; flex-wrap: wrap;
        max-height: 750px; overflow: auto;" hidden>
        </div>

        <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
        <script src="{{url_for('static', filename='microfrontend.js')}}"></script>

        <script>
        const dimensionLabelsUrl = "{{ dimension_labels_url }}";

        // Asks the plugin for the feature name of every dimension of the mapping file.
        // Returns an empty mapping when no file is selected or the file cannot be read,
        // so the preview stays usable without dimension names.
        async function loadDimensionLabels(mappingUrl) {
            if (mappingUrl == null || mappingUrl === "") {
                return {};
            }
            const params = new URLSearchParams();
            params.set("dimensionMappingUrl", mappingUrl);
            try {
                const response = await fetch(`${dimensionLabelsUrl}?${params.toString()}`);
                if (!response.ok) {
                    return {};
                }
                return await response.json();
            } catch (error) {
                console.log(error);
                return {};
            }
        }

        function buildHeaderCell(column, dimensionLabels) {
            const th = document.createElement("th");
            th.appendChild(document.createTextNode(column));
            const feature = dimensionLabels[column];
            if (feature) {
                th.setAttribute("title", `Dimension ${column} holds the feature ${feature}`);
                const featureName = document.createElement("span");
                featureName.className = "qhana-dimension-feature";
                featureName.textContent = feature;
                th.appendChild(featureName);
            }
            return th;
        }

        async function updatePreview(newUrl) {
            const dataPreview = document.querySelector('#csv-preview');
            const options = document.querySelector('#visualization-options');
            if (newUrl == null || newUrl === "") {
                dataPreview.setAttribute("hidden", "hidden");
                options.setAttribute("open", "open");
                return;
            }

            const dimensionLabels = await loadDimensionLabels(mappingInput.value);
            let csv_header = null;
            const rows = [];
            options.setAttribute("open", "open");
            Papa.parse(newUrl, {
                download: true,
                preview: 101,
                worker: true,
                step: function(results) {
                    if (csv_header == null) {
                        csv_header = results.data;
                        return;
                    }
                    rows.push(results.data);
                },
                complete: function() {
                    const table = document.createElement("table");
                    headerRow = document.createElement("tr");
                    table.appendChild(headerRow)
                    csv_header.forEach(column => {
                        headerRow.appendChild(buildHeaderCell(column, dimensionLabels));
                    });
                    rows.forEach(row => {
                        const tr = document.createElement("tr");
                        row.forEach(column => {
                            const td = document.createElement("td");
                            td.appendChild(document.createTextNode(column));
                            tr.appendChild(td);
                        });
                        table.appendChild(tr)
                    });
                    dataPreview.replaceChildren(table);
                    dataPreview.removeAttribute("hidden");
                    options.removeAttribute("open");
                }
            });
        }

        let requestedRelatedFor = null;

        // Asks the parent to fill the dimension mapping input with a file related
        // to the csv file. The mapping is a sibling output of the step that
        // produced the csv file, so the search includes the producing step itself.
        function autoSelectDimensionMapping(dataUrl) {
            if (!dataUrl || mappingInput.value) {
                requestedRelatedFor = null;
                return;
            }
            const looksLikeUrl = dataUrl.includes("://") || dataUrl.startsWith("data:");
            if (!looksLikeUrl || requestedRelatedFor === dataUrl) {
                return;
            }
            requestedRelatedFor = dataUrl;
            sendMessage({
                type: "request-related-data-url",
                inputKey: "dimension_mapping_url",
                dataUrl: dataUrl,
                relation: "pre",
                includeSelf: true,
                acceptedInputType: "entity/dimension-mapping",
                userInteraction: false,
            });
        }

        const dataInput = document.querySelector('input[name=data]');
        const mappingInput = document.querySelector('input[name=dimensionMappingUrl]');
        autoSelectDimensionMapping(dataInput.value);
        updatePreview(dataInput.value);
        dataInput.addEventListener("input", (event) => {
            autoSelectDimensionMapping(dataInput.value);
            updatePreview(dataInput.value);
        });
        mappingInput.addEventListener("input", (event) => updatePreview(dataInput.value));
        </script>

    </body>
</html>
