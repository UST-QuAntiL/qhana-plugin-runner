name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # keep the virtualenv inside the workspace so it can be cached by path
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHON_VERSION: "3.14"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry

      - name: Restore runner virtualenv
        id: cache-runner-venv
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: venv-runner-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Save runner virtualenv
        if: steps.cache-runner-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .venv
          key: venv-runner-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Collect plugin requirements
        id: plugin-requirements
        run: |
          poetry run flask install --dry-run --skip-runner-dependencies > plugin-requirements.raw.txt
          # plugin import order is not stable, so sort before hashing
          sort -u plugin-requirements.raw.txt > plugin-requirements.txt
          echo "hash=$(sha256sum plugin-requirements.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          cat plugin-requirements.txt

      - name: Restore virtualenv with plugin dependencies
        id: cache-plugin-venv
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: venv-plugins-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-${{ steps.plugin-requirements.outputs.hash }}
          # Fallback if no cache matches the exact key: restore the newest venv matching one of
          # these prefixes. The install step then only adds the changed packages.
          restore-keys: |
            venv-plugins-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-
            venv-plugins-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

      - name: Install plugin dependencies
        if: steps.cache-plugin-venv.outputs.cache-hit != 'true'
        env:
          # CPU-only torch wheels skip the CUDA packages, which make up most of the venv size
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          # The restored venv replaces the one from "Install dependencies". A venv restored
          # through the second restore-keys prefix can come from an older poetry.lock, so
          # update the runner packages before adding the plugin packages.
          poetry install --no-interaction --with dev
          poetry run flask install --skip-runner-dependencies

      - name: Save virtualenv with plugin dependencies
        if: steps.cache-plugin-venv.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .venv
          key: venv-plugins-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-${{ steps.plugin-requirements.outputs.hash }}

      - name: Run pytest
        run: poetry run pytest --cov=qhana_plugin_runner --cov-report=html --cov-report=term
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
