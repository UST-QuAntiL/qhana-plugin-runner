{% extends 'simple_template.html' %}

{% block script %}
{{ super() }}
<script>
    (function () {
        const autoField = document.getElementById("input_range_auto");
        const minField = document.getElementById("input_range_min");
        const maxField = document.getElementById("input_range_max");
        if (!autoField || !minField || !maxField) return;

        const minContainer = minField.closest(".qhana-form-field") || minField.parentElement;
        const maxContainer = maxField.closest(".qhana-form-field") || maxField.parentElement;

        function updateManualRange() {
            const disabled = autoField.checked;
            minField.disabled = disabled;
            maxField.disabled = disabled;
            if (minContainer) minContainer.hidden = disabled;
            if (maxContainer) maxContainer.hidden = disabled;
        }

        autoField.addEventListener("change", updateManualRange);
        updateManualRange();
    })();
</script>
{% endblock script %}
