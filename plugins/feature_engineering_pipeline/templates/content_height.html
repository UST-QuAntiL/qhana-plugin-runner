<script>
    // the shared height monitor measures the document element, which never shrinks below the
    // iframe height, so hiding form content needs an explicitly measured content height
    function reportContentHeight() {
        const bodyStyle = window.getComputedStyle(document.body);
        const height = Math.ceil(
            document.body.getBoundingClientRect().height
            + parseFloat(bodyStyle.marginTop)
            + parseFloat(bodyStyle.marginBottom)
        );
        const state = window._qhana_microfrontend_state;
        if (state != null) {
            state.height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        }
        sendMessage({ type: "ui-resize", height: height });
    }
</script>
